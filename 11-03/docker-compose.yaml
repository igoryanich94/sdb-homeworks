version: '3.7'

services:
  # Elasticsearch Docker Images: https://www.docker.elastic.co/
  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - cluster.name=RandomName_BUGAGA
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300

  kibana:
    container_name: kibana
    image: kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch

  logstash:
    container_name: logstash_one_channel
    image: logstash:8.15.3
    environment:
      ES_HOST: "http://elasticsearch:9200"
#      XPACK_MONITORING_ENABLED: "false"
    ports:
      - 5046:5046
    volumes:
      - ./config/pipelines.yml:/usr/share/logstash/config/pipelines.yml
      - ./config/pipelines/:/usr/share/logstash/config/pipelines
      - /var/log/nginx/:/usr/share/logstash/input
    depends_on:
      - elasticsearch
#      - ./output:/usr/share/logstash/output

  filebeat:
    image: elastic/filebeat:8.12.2
    command: --strict.perms=false
    user: root
    volumes:
      - ./projects/test/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/log/nginx/:/usr/share/input
#      - /var/lib/docker:/var/lib/docker:ro
#      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - elasticsearch
      - logstash
      - kibana

volumes:
  elasticsearch-data:
    driver: local
